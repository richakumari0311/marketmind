<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketMind</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  header {
    padding: 14px 16px;
    border-bottom: 1px solid #1e2535;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0f1117;
  }
  header h1 { font-size: 17px; font-weight: 600; color: #f8fafc; }
  header .badge {
    font-size: 10px; font-weight: 500;
    background: #1a2744; color: #60a5fa;
    border: 1px solid #2d4a8a;
    padding: 2px 8px; border-radius: 20px;
  }

  /* ── Mobile-first layout ── */
  .layout {
    display: flex;
    flex-direction: column;
  }

  /* History panel — horizontal scroll on mobile */
  .history {
    border-bottom: 1px solid #1e2535;
    overflow: hidden;
  }
  .history-header {
    padding: 10px 16px 6px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: #475569;
    border-bottom: 1px solid #1e2535;
  }
  .history-list {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    padding: 6px 8px;
    gap: 6px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .history-list::-webkit-scrollbar { display: none; }
  .history-item {
    flex-shrink: 0;
    padding: 8px 12px;
    cursor: pointer;
    border: 1px solid #1e2535;
    border-radius: 8px;
    background: #161b27;
    transition: all 0.15s;
    min-width: 140px;
    max-width: 180px;
  }
  .history-item:hover { border-color: #334155; }
  .history-item.active { border-color: #2563eb; background: #0f1a2e; }
  .history-item .hi-name {
    font-size: 11px; font-weight: 600; color: #cbd5e1;
    margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .history-item .hi-meta { font-size: 10px; color: #475569; display: flex; gap: 6px; flex-wrap: wrap; }
  .history-item .hi-score { font-size: 10px; font-weight: 600; color: #4ade80; }
  .history-empty { padding: 14px 16px; font-size: 11px; color: #334155; }

  /* Main content area */
  .right {
    display: flex;
    flex-direction: column;
  }

  /* Input sidebar — full width on mobile */
  .sidebar {
    border-bottom: 1px solid #1e2535;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Two-col grid for goal + pieces on mobile */
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  label {
    display: block;
    font-size: 10px; font-weight: 500;
    color: #94a3b8;
    margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  textarea {
    width: 100%;
    background: #161b27;
    border: 1px solid #1e2535;
    border-radius: 7px;
    color: #e2e8f0;
    font-size: 13px; line-height: 1.6;
    padding: 10px; resize: vertical; min-height: 100px;
    outline: none; transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  textarea:focus { border-color: #3b82f6; }

  select, input[type="number"] {
    width: 100%;
    background: #161b27;
    border: 1px solid #1e2535;
    border-radius: 7px;
    color: #e2e8f0;
    font-size: 13px; padding: 10px 12px;
    outline: none; transition: border-color 0.15s;
    -webkit-appearance: none; appearance: none;
    min-height: 44px;
  }
  select:focus, input[type="number"]:focus { border-color: #3b82f6; }

  .examples-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .run-btn {
    background: #2563eb; color: #fff;
    border: none; border-radius: 8px;
    padding: 13px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, opacity 0.15s; width: 100%;
    min-height: 48px;
  }
  .run-btn:hover { background: #1d4ed8; }
  .run-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .run-btn:active { transform: scale(0.98); }

  .example-btn {
    background: #161b27;
    border: 1px solid #1e2535;
    border-radius: 6px;
    color: #64748b;
    font-size: 11px; padding: 8px 10px;
    text-align: left; cursor: pointer;
    transition: all 0.15s; width: 100%;
    min-height: 44px;
    line-height: 1.3;
  }
  .example-btn:hover { border-color: #2563eb; color: #93c5fd; background: #0f1a2e; }

  .pipeline {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .phase-row {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 10px; border-radius: 6px;
    background: #161b27; border: 1px solid #1e2535;
    font-size: 11px; color: #64748b; transition: all 0.2s;
  }
  .phase-row.running { border-color: #2563eb; color: #93c5fd; }
  .phase-row.done    { border-color: #16a34a; color: #86efac; }
  .phase-row.error   { border-color: #dc2626; color: #fca5a5; }
  .phase-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #1e2535; flex-shrink: 0; transition: background 0.2s;
  }
  .phase-row.running .phase-dot { background: #2563eb; animation: pulse 1s infinite; }
  .phase-row.done .phase-dot    { background: #16a34a; }
  .phase-row.error .phase-dot   { background: #dc2626; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Results area */
  .main {
    padding: 16px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 16px;
    gap: 8px; color: #334155; font-size: 13px; text-align: center;
  }

  .campaign-banner {
    background: #0f1a2e; border: 1px solid #2d4a8a;
    border-radius: 10px; padding: 16px;
  }
  .campaign-banner .goal-tag {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: #60a5fa; margin-bottom: 4px;
  }
  .campaign-banner h2 { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; line-height: 1.4; }

  .action-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .export-btn {
    padding: 8px 14px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid;
    transition: all 0.15s; text-decoration: none; display: inline-block;
    min-height: 36px; white-space: nowrap;
  }
  .export-btn.pdf    { background: #1c1c2e; color: #a78bfa; border-color: #4c1d95; }
  .export-btn.docx   { background: #0f1e2e; color: #60a5fa; border-color: #1e3a5f; }
  .export-btn.notion { background: #1a1a1a; color: #e2e8f0; border-color: #333; }
  .export-btn:hover  { opacity: 0.8; }
  .export-btn.disabled { opacity: 0.35; pointer-events: none; }

  .kpi-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .kpi {
    background: #0a1120; border: 1px solid #1e3a5f;
    border-radius: 6px; padding: 7px 10px; font-size: 11px;
    flex: 1; min-width: 100px;
  }
  .kpi .kpi-label { color: #64748b; margin-bottom: 2px; }
  .kpi .kpi-value { color: #93c5fd; font-weight: 600; }

  .section-header {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; color: #475569;
    padding-bottom: 8px; border-bottom: 1px solid #1e2535;
  }

  .scores-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .score-card {
    background: #161b27; border: 1px solid #1e2535;
    border-radius: 8px; padding: 12px;
  }
  .score-top {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 8px; margin-bottom: 8px;
  }
  .score-title { font-size: 11px; font-weight: 600; color: #cbd5e1; line-height: 1.4; }
  .score-badge { font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .score-badge.high { color: #4ade80; }
  .score-badge.mid  { color: #facc15; }
  .score-badge.low  { color: #f87171; }
  .dim-bars { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .dim-bar-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: #64748b;
  }
  .dim-bar-row span:first-child { width: 72px; flex-shrink: 0; }
  .bar-track {
    flex: 1; background: #1e2535;
    border-radius: 3px; height: 4px; overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 3px; background: #2563eb; transition: width 0.6s ease; }
  .dim-val { width: 16px; text-align: right; flex-shrink: 0; }
  .score-verdict {
    font-size: 10px; color: #64748b; line-height: 1.5;
    border-top: 1px solid #1e2535; padding-top: 6px;
  }

  .pieces-list { display: flex; flex-direction: column; gap: 10px; }
  .piece-card {
    background: #161b27; border: 1px solid #1e2535;
    border-radius: 8px; overflow: hidden;
  }
  .piece-card.rewritten { border-color: #16a34a; }
  .piece-header {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid #1e2535;
    background: #0f1117; cursor: pointer; user-select: none;
    flex-wrap: wrap;
  }
  .piece-header:hover { background: #161b27; }
  .type-tag {
    font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    padding: 2px 6px; border-radius: 3px;
    background: #1a2744; color: #60a5fa;
    border: 1px solid #2d4a8a; flex-shrink: 0;
    margin-top: 1px;
  }
  .rewritten .type-tag { background: #14321f; color: #4ade80; border-color: #166534; }
  .piece-title { font-size: 12px; font-weight: 600; color: #e2e8f0; flex: 1; min-width: 0; line-height: 1.4; }
  .piece-meta { display: flex; gap: 8px; font-size: 10px; color: #475569; flex-shrink: 0; width: 100%; padding-top: 4px; }
  .rewrite-label { font-size: 10px; font-weight: 600; text-transform: uppercase; color: #4ade80; }
  .piece-body { padding: 14px; display: none; }
  .piece-body.open { display: block; }
  .piece-content {
    font-size: 13px; line-height: 1.75;
    color: #94a3b8; white-space: pre-wrap; word-break: break-word;
  }
  .piece-cta {
    margin-top: 8px; padding: 8px 10px;
    background: #0f1a2e; border: 1px solid #1e3a5f;
    border-radius: 6px; font-size: 12px; color: #60a5fa;
  }
  .changes-list { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .change-item {
    font-size: 11px; color: #4ade80;
    padding: 3px 0; border-top: 1px solid #1e2535;
  }
  .change-item:first-child { border-top: none; }
  .error-box {
    background: #1c0a0a; border: 1px solid #7f1d1d;
    border-radius: 8px; padding: 12px;
    color: #fca5a5; font-size: 12px;
  }

  /* ── Tablet / Desktop breakpoints ── */
  @media (min-width: 640px) {
    .scores-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .sidebar { padding: 20px; }
    .main { padding: 20px 24px; }
    .campaign-banner h2 { font-size: 18px; }
    .pipeline { grid-template-columns: repeat(4, 1fr); }
  }

  @media (min-width: 900px) {
    .layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      height: calc(100vh - 53px);
      overflow: hidden;
    }
    .history {
      border-bottom: none;
      border-right: 1px solid #1e2535;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .history-list {
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 6px 0;
    }
    .history-item {
      border: none;
      border-left: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      min-width: unset;
      max-width: unset;
    }
    .history-item.active { background: #161b27; border-left-color: #2563eb; }
    .history-empty { padding: 20px 14px; text-align: center; }

    .right {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100%;
      overflow: hidden;
    }
    .sidebar {
      border-bottom: none;
      border-right: 1px solid #1e2535;
      overflow-y: auto;
      padding: 16px 14px;
    }
    .input-row { grid-template-columns: 1fr; }
    .examples-grid { grid-template-columns: 1fr; }
    .pipeline { grid-template-columns: 1fr; }

    .main { overflow-y: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>MarketMind</h1>
  <span class="badge">AI Agent Pipeline</span>
</header>

<div class="layout">

  <aside class="history">
    <div class="history-header">Campaign history</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">No campaigns yet</div>
    </div>
  </aside>

  <div class="right">

    <aside class="sidebar">
      <div>
        <label>Product description</label>
        <textarea id="product" placeholder="Describe your product..."></textarea>
        <div style="margin-top:10px">
          <div style="font-size:10px;color:#475569;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">
            Quick examples
          </div>
          <div class="examples-grid">
            <button class="example-btn" onclick="setExample('fitai')">FitAI — fitness app</button>
            <button class="example-btn" onclick="setExample('legaldesk')">LegalDesk — legal SaaS</button>
            <button class="example-btn" onclick="setExample('shipfast')">ShipFast — logistics</button>
            <button class="example-btn" onclick="setExample('eduflow')">EduFlow — edtech</button>
            <button class="example-btn" onclick="setExample('marketmind')" style="grid-column:1/-1">MarketMind — demo</button>
          </div>
        </div>
      </div>
      <div class="input-row">
        <div>
          <label>Campaign goal</label>
          <select id="goal">
            <option value="awareness">Awareness</option>
            <option value="leads">Leads</option>
            <option value="retention">Retention</option>
          </select>
        </div>
        <div>
          <label>Pieces</label>
          <input type="number" id="pieces" value="3" min="1" max="6" />
        </div>
      </div>
      <button class="run-btn" id="runBtn" onclick="runPipeline()">Run Campaign</button>
      <div class="pipeline" id="pipeline">
        <div class="phase-row" id="phase-1"><div class="phase-dot"></div> ResearchAgent</div>
        <div class="phase-row" id="phase-2"><div class="phase-dot"></div> StrategyAgent</div>
        <div class="phase-row" id="phase-3"><div class="phase-dot"></div> ContentAgent</div>
        <div class="phase-row" id="phase-4"><div class="phase-dot"></div> CritiqueAgent</div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="empty-state" id="emptyState">
        Run a campaign or select one from history
      </div>
    </main>

  </div>
</div>

<script>
  const EXAMPLES = {
    marketmind: {
      product: `MarketMind -- a B2B SaaS tool that helps marketing teams at remote-first startups plan, generate, and iterate on campaign content using AI agents. Replaces 3-4 separate tools with one unified workflow.`,
      goal: "awareness"
    },
    fitai: {
      product: `FitAI -- a mobile fitness app that uses AI to create personalized workout and nutrition plans for busy professionals aged 25-40. Competes with MyFitnessPal and Whoop. Key differentiator: adapts plans daily based on sleep, stress, and calendar data.`,
      goal: "leads"
    },
    legaldesk: {
      product: `LegalDesk -- a B2B SaaS platform that helps small law firms (2-15 lawyers) automate client intake, document generation, and billing. Replaces manual Word templates and spreadsheets. Target buyer: law firm managing partners who are not tech-savvy.`,
      goal: "awareness"
    },
    shipfast: {
      product: `ShipFast -- a logistics coordination tool for e-commerce brands doing $1M-$10M in annual revenue. Connects with Shopify, automates carrier selection, and reduces shipping costs by 15-30%. Target buyer: e-commerce operations managers frustrated with manual carrier comparisons.`,
      goal: "leads"
    },
    eduflow: {
      product: `EduFlow -- an edtech platform for corporate L&D teams at mid-size companies (200-2000 employees). Turns internal documentation and SOPs into interactive micro-learning courses using AI. Competes with Docebo and Cornerstone. Key pain point: existing LMS platforms require dedicated instructional designers.`,
      goal: "retention"
    },
  };

  function setExample(key) {
    const ex = EXAMPLES[key];
    if (!ex) return;
    document.getElementById("product").value = ex.product;
    document.getElementById("goal").value = ex.goal;
  }

  let currentRunId = null;
  window.addEventListener("DOMContentLoaded", loadHistory);

  function loadHistory() {
    fetch("/campaigns")
      .then(r => r.json())
      .then(campaigns => renderHistory(campaigns))
      .catch(() => {});
  }

  function renderHistory(campaigns) {
    const list = document.getElementById("historyList");
    if (!campaigns.length) {
      list.innerHTML = '<div class="history-empty">No campaigns yet</div>';
      return;
    }
    list.innerHTML = campaigns.map(c => `
      <div class="history-item" id="hi-${c.run_id}" onclick="loadCampaign('${c.run_id}')">
        <div class="hi-name">${c.campaign_name}</div>
        <div class="hi-meta">
          <span>${c.date}</span>
          <span>${c.goal}</span>
          <span class="hi-score">${c.avg_score}/100</span>
        </div>
      </div>
    `).join("");
  }

  function loadCampaign(run_id) {
    document.querySelectorAll(".history-item").forEach(el => el.classList.remove("active"));
    const item = document.getElementById("hi-" + run_id);
    if (item) item.classList.add("active");

    fetch(`/campaigns/${run_id}`)
      .then(r => r.json())
      .then(data => {
        currentRunId = run_id;
        clearMain();
        const notion_url = data.meta && data.meta.notion_url ? data.meta.notion_url : "";
        renderCampaignBanner(data.strategy, data.meta, run_id, notion_url);
        if (data.content)  renderContent(data.content);
        if (data.critique) {
          renderScores(data.critique.scores || []);
          renderRewrite(data.critique);
        }
      });
  }

  function resetPhases() {
    [1,2,3,4].forEach(i => {
      document.getElementById("phase-"+i).className = "phase-row";
    });
  }
  function setPhase(num, status) {
    document.getElementById("phase-"+num).className = "phase-row " + status;
  }
  function clearMain() {
    document.getElementById("main").innerHTML = "";
  }
  function appendSection(id, html) {
    const main = document.getElementById("main");
    const div = document.createElement("div");
    div.id = id; div.innerHTML = html;
    main.appendChild(div);
  }
  function scoreBadgeClass(total) {
    return total >= 75 ? "high" : total >= 55 ? "mid" : "low";
  }

  function renderCampaignBanner(strategy, meta, run_id, notion_url) {
    const kpis = (strategy.kpis || []).slice(0,3).map(k => `
      <div class="kpi">
        <div class="kpi-label">${k.metric||""}</div>
        <div class="kpi-value">${k.target||""}</div>
      </div>
    `).join("");
    const rid = run_id || "";
    const disabled = rid ? "" : "disabled";
    const notionBtn = notion_url
      ? `<a class="export-btn notion" href="${notion_url}" target="_blank">View in Notion</a>`
      : "";
    appendSection("banner", `
      <div class="campaign-banner">
        <div class="goal-tag">Campaign</div>
        <h2>${strategy.campaign_name||"Campaign"}</h2>
        <div style="font-size:12px;color:#64748b;line-height:1.6">${strategy.core_message||""}</div>
        <div class="kpi-row">${kpis}</div>
        <div class="action-row">
          <a class="export-btn pdf ${disabled}" href="/campaigns/${rid}/export/pdf" target="_blank">Download PDF</a>
          <a class="export-btn docx ${disabled}" href="/campaigns/${rid}/export/docx" target="_blank">Download DOCX</a>
          ${notionBtn}
        </div>
      </div>
    `);
  }

  function renderScores(scores) {
    const cards = scores.map(s => {
      const dims = s.scores || {};
      const dimNames = ["clarity","relevance","conversion","originality"];
      const bars = dimNames.map(d => `
        <div class="dim-bar-row">
          <span>${d}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(dims[d]||0)*10}%"></div></div>
          <span class="dim-val">${dims[d]||0}</span>
        </div>
      `).join("");
      return `
        <div class="score-card">
          <div class="score-top">
            <div class="score-title">${s.title||""}</div>
            <div class="score-badge ${scoreBadgeClass(s.total)}">${s.total}</div>
          </div>
          <div class="dim-bars">${bars}</div>
          <div class="score-verdict">${s.verdict||""}</div>
        </div>
      `;
    }).join("");
    appendSection("scores", `
      <div class="section-header">Critique Scores</div>
      <div class="scores-grid" style="margin-top:12px">${cards}</div>
    `);
  }

  function cleanContent(text) {
    if (!text) return "";
    text = text.replace(/\\n/g, "\n");
    text = text.replace(/\\u([0-9a-fA-F]{4})/g, (m, hex) => {
      try { return String.fromCharCode(parseInt(hex,16)); } catch(e) { return m; }
    });
    text = text.replace(/<[^>]+>/g, "");
    return text.trim();
  }

  function renderPiece(piece, index, isRewritten) {
    const content = cleanContent(piece.content||"");
    const words   = (piece.meta||{}).word_count||0;
    const cta     = (piece.meta||{}).cta||"";
    const bodyId  = "body-"+index+(isRewritten?"-r":"");
    const changes = isRewritten && piece.changes
      ? piece.changes.map(c => `<div class="change-item">[+] ${c}</div>`).join("") : "";
    return `
      <div class="piece-card ${isRewritten?"rewritten":""}">
        <div class="piece-header" onclick="toggleBody('${bodyId}')">
          <span class="type-tag">${(piece.type||"").toUpperCase()}</span>
          <span class="piece-title">${piece.title||"Untitled"}</span>
          <div class="piece-meta">
            ${isRewritten ? '<span class="rewrite-label">Rewritten</span>' : ""}
            <span>${words}w</span>
            <span>${piece.channel||""}</span>
          </div>
        </div>
        <div class="piece-body" id="${bodyId}">
          <div class="piece-content">${content}</div>
          ${cta ? `<div class="piece-cta"><b>CTA:</b> ${cta}</div>` : ""}
          ${changes ? `<div class="changes-list">${changes}</div>` : ""}
        </div>
      </div>
    `;
  }

  function toggleBody(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("open");
  }

  function renderContent(contentPack) {
    const pieces = (contentPack.content||[]).map((p,i) => renderPiece(p,i,false)).join("");
    appendSection("content", `
      <div class="section-header">Content Pieces</div>
      <div class="pieces-list" style="margin-top:12px">${pieces}</div>
    `);
  }

  function renderRewrite(critique) {
    const rewritten = critique.weakest_rewritten;
    if (!rewritten) return;
    appendSection("rewrite", `
      <div class="section-header">Auto-Rewritten Piece</div>
      <div class="pieces-list" style="margin-top:12px">
        ${renderPiece(rewritten, 99, true)}
      </div>
    `);
  }

  function runPipeline() {
    const product = document.getElementById("product").value.trim();
    const goal    = document.getElementById("goal").value;
    const pieces  = parseInt(document.getElementById("pieces").value, 10);
    if (!product) { alert("Please enter a product description."); return; }

    const btn = document.getElementById("runBtn");
    btn.disabled = true;
    btn.textContent = "Running...";

    resetPhases();
    clearMain();
    currentRunId = null;

    fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product, goal, pieces }),
    }).then(res => {
      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let currentEvent = null;

      function processBuffer() {
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith("event: ")) {
            currentEvent = line.slice(7).trim();
          } else if (line.startsWith("data: ")) {
            try {
              const data = JSON.parse(line.slice(6).trim());
              handleEvent(currentEvent, data);
            } catch(e) {}
          }
        }
      }

      function read() {
        reader.read().then(({ done, value }) => {
          if (done) {
            btn.disabled = false;
            btn.textContent = "Run Campaign";
            return;
          }
          buffer += decoder.decode(value, { stream: true });
          processBuffer();
          read();
        });
      }
      read();
    });
  }

  function handleEvent(type, data) {
    if (type === "progress") {
      setPhase(data.phase, data.status);
    } else if (type === "strategy") {
      renderCampaignBanner(data, {}, null, "");
    } else if (type === "content") {
      renderContent(data);
    } else if (type === "critique") {
      renderScores(data.scores||[]);
      renderRewrite(data);
    } else if (type === "done") {
      document.getElementById("runBtn").disabled = false;
      document.getElementById("runBtn").textContent = "Run Again";
      currentRunId = data.run_id;

      const actionRow = document.querySelector(".action-row");
      if (actionRow) {
        actionRow.innerHTML = `
          <a class="export-btn pdf" href="/campaigns/${data.run_id}/export/pdf" target="_blank">Download PDF</a>
          <a class="export-btn docx" href="/campaigns/${data.run_id}/export/docx" target="_blank">Download DOCX</a>
          ${data.notion_url ? `<a class="export-btn notion" href="${data.notion_url}" target="_blank">View in Notion</a>` : ""}
        `;
      }
      loadHistory();
    } else if (type === "error") {
      const label = data.phase ? "Phase "+data.phase+" error" : "Pipeline error";
      appendSection("error-"+(data.phase||"g"), `
        <div class="error-box">
          <b>${label}:</b> ${data.message}
          <br><br>
          <span style="color:#94a3b8;font-size:11px">Usually a local model JSON issue -- retry the run.</span>
        </div>
      `);
      document.getElementById("runBtn").disabled = false;
      document.getElementById("runBtn").textContent = "Run Campaign";
    }
  }
</script>
</body>
</html>
